# ============================================================================
# Azure Pipelines Main Configuration
# ============================================================================
#
# This pipeline:
# 1. Builds the library on Windows (x64 and arm64)
# 2. Builds the library on Linux (Clang and GCC)
# 3. Runs tests on all platforms
# 4. Publishes to NuGet and GitHub (on main/master branches)
#
# Pipeline Stages:
# 1. StgBldWindows - Builds on Windows with MSVC
# 2. StgBldLinux   - Builds on Linux with Clang/GCC
# 3. Publication   - Publishes to NuGet and GitHub
#
# Documentation: See PIPELINE_DOCUMENTATION_INDEX.md for detailed information
# ============================================================================

# ============================================================================
# TRIGGER & PR CONFIGURATION
# ============================================================================
trigger:
  branches:
    include:
      - main
      - master
      - development
      - develop
      - release/*
  paths:
    exclude:
      - README.md
      - .ci/* # Skip CI when changing pipeline files
      - azure-pipelines.yml # Avoids recursive triggers when modifying the pipeline itself
pr:
  branches:
    include:
      - main
      - release/*

# ============================================================================
# RESOURCES
# ============================================================================
resources:
  repositories:
    - repository: self
      type: git

# ============================================================================
# PARAMETERS
# ============================================================================
parameters:
  # Platform Selection
  - name: RunWindows
    type: boolean
    default: true
    displayName: "Run Windows builds (x64 and arm64)"

  - name: RunLinux
    type: boolean
    default: true
    displayName: "Run Linux builds (Clang and GCC)"

  - name: RunLinuxClangOnly
    type: boolean
    default: true
    displayName: "Linux Clang only (skip GCC for faster CI)"

  # Build Configuration
  - name: BuildX64
    type: boolean
    default: false
    displayName: "Enable x64 builds (Windows)"

  - name: BuildDebug
    type: boolean
    default: false
    displayName: "Enable Debug builds"

  # Publishing
  - name: PublishNuGet
    type: boolean
    default: false
    displayName: "Publish to NuGet (auto-enabled on main/master)"

  - name: PublishGitHub
    type: boolean
    default: false
    displayName: "Create GitHub release (auto-enabled on main/master)"

  # Testing & Cleanup
  - name: RunTests
    type: boolean
    default: true
    displayName: "Run tests after building"

  - name: Cleanup
    type: boolean
    default: false
    displayName: "Cleanup only (skip builds and tests)"

# ============================================================================
# VARIABLES
# ============================================================================
variables:
  # Auto-enable publishing on main/master branches
  ${{ if and(eq(parameters.PublishNuGet, false), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master'))) }}:
    PublishNuGet: true
    PublishGitHub: true
  ${{ else }}:
    PublishNuGet: ${{ parameters.PublishNuGet }}
    PublishGitHub: ${{ parameters.PublishGitHub }}

  # System information
  AgentOS: $(Agent.OS)
  AgentArch: $(Agent.OSArchitecture)

  # Some global variables
  # Windows uses a batch file to start the emulator, Linux uses a docker image directly in the pipeline
  dockerImageUri: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20260331
  dockerContainerName: linux-emulator
  emulatorName: linux-emulator
  emulatorWaitSeconds: 60
  emulatorUrl: http://localhost:8081
  cpmCachePath: $(Agent.HomeDirectory)/.cpmcache
  buildOutputPath: $(System.DefaultWorkingDirectory)/build/$(cmake.preset)
  testResultsPath: $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests/results

# ============================================================================
# STAGES
# ============================================================================
stages:
  # ==========================================================================
  # STAGE 1: WINDOWS BUILD
  # ==========================================================================
  - stage: StgBldWindows
    displayName: Windows
    dependsOn: []
    condition: eq(${{ parameters.RunWindows }}, true)
    jobs:
      # Windows x64
      - template: .ci/az-build-windows.yml
        parameters:
          displayName: Windows x64
          architecture: x64
          runTests: false # disable due to docker issues ${{ parameters.RunTests }}
          publishNuGet: ${{ parameters.PublishNuGet }}
          BuildX64: ${{ parameters.BuildX64 }}
          BuildDebug: ${{ parameters.BuildDebug }}
          Cleanup: ${{ parameters.Cleanup }}
          matrixConfigs:
            Windows_x64_Release:
              BuildType: Release
              BuildArchitecture: x64
              cmake.preset: Windows-x64-Release
            ${{ if eq(parameters.BuildDebug, true) }}:
              Windows_x64_Debug:
                BuildType: Debug
                BuildArchitecture: x64
                cmake.preset: Windows-x64-Debug

      # Windows arm64 (Docker unavailable, skip tests)
      - template: .ci/az-build-windows.yml
        parameters:
          displayName: Windows arm64
          architecture: arm64
          runTests: false
          publishNuGet: ${{ parameters.PublishNuGet }}
          BuildX64: ${{ parameters.BuildX64 }}
          BuildDebug: ${{ parameters.BuildDebug }}
          Cleanup: ${{ parameters.Cleanup }}
          matrixConfigs:
            Windows_arm64_Release:
              BuildType: Release
              BuildArchitecture: arm64
              cmake.preset: Windows-arm64-Release
            ${{ if eq(parameters.BuildDebug, true) }}:
              Windows_arm64_Debug:
                BuildType: Debug
                BuildArchitecture: arm64
                cmake.preset: Windows-arm64-Debug

  # ==========================================================================
  # STAGE 2: LINUX BUILD
  # ==========================================================================
  - stage: StgBldLinux
    displayName: Linux
    dependsOn: []
    condition: eq(${{ parameters.RunLinux }}, true)
    jobs:
      - template: .ci/az-build-linux.yml
        parameters:
          displayName: Linux Builds (Clang & GCC)
          runTests: ${{ parameters.RunTests }}
          Cleanup: ${{ parameters.Cleanup }}
          matrixConfigs:
            # Clang builds (always included)
            Linux_Clang_Release:
              BuildType: Release
              LinuxCompiler: Clang
              cmake.preset: Linux-Clang-Release
            ${{ if eq(parameters.BuildDebug, true) }}:
              Linux_Clang_Debug:
                BuildType: Debug
                LinuxCompiler: Clang
                cmake.preset: Linux-Clang-Debug
            # GCC builds (conditional on RunLinuxClangOnly)
            ${{ if eq(parameters.RunLinuxClangOnly, false) }}:
              Linux_GCC_Release:
                BuildType: Release
                LinuxCompiler: GCC
                cmake.preset: Linux-GCC-Release
            ${{ if and(eq(parameters.RunLinuxClangOnly, false), eq(parameters.BuildDebug, true)) }}:
              Linux_GCC_Debug:
                BuildType: Debug
                LinuxCompiler: GCC
                cmake.preset: Linux-GCC-Debug

  # ==========================================================================
  # STAGE 3: PUBLICATION
  # ==========================================================================
  - stage: Publication
    displayName: Publication
    dependsOn:
      - StgBldWindows
      - StgBldLinux
    condition: and(ne(${{ parameters.Cleanup }}, true), succeeded())
    jobs:
      # NuGet Release
      - template: .ci/az-publish-nuget.yml
        parameters:
          displayName: NuGet Release
          PublishNuGet: ${{ variables.PublishNuGet }}

      # GitHub Release
      - template: .ci/az-publish-github.yml
        parameters:
          displayName: GitHub Release
          PublishGitHub: ${{ variables.PublishGitHub }}
