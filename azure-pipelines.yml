###############################################
# SiddiqSoft Azure DevOps Pipelines Template  #
# For C++ Projects                            #
# Version 2.0                                 #
###############################################
trigger:
  batch: 'true'
  branches:
    include:
    - master
    - main
    - bugfix/*
    - release/*
    - hotfix/*
    - feature/*
  paths:
    exclude:
    - README.md

stages:
################################## STAGE ####################################
# STAGE: BuildTest                                                          #
#############################################################################
- stage: BuildTest
  displayName: 'Building, Testing and Package'
  jobs:
  - job: buildWindows
    displayName: 'Build and Test Windows'
    workspace:
      clean: all
    pool:
      name: Default
      demands:
        - Agent.OS -equals Windows_NT
        - docker
    strategy:
      matrix:
        Debug:
          BuildType: Debug
          cmake.preset: 'Windows-$(BuildType)'
          MSBuildConfiguration: Debug
        Release:
          BuildType: Release
          cmake.preset: 'Windows-$(BuildType)'
          MSBuildConfiguration: Release
    steps:
    - checkout: self
      fetchDepth: 0
      name: step1
    - task: gitversion-setup@4
      displayName: 'Install GitVersion..'
      inputs:
        versionSpec: '6.x'
        preferLatestVersion: true
    - task: gitversion-execute@4
      displayName: 'Determine Version..'
      name: version_step
      inputs:
        useConfigFile: true
        configFilePath: 'GitVersion.yml'
    - task: CMake@1
      displayName: 'CMake Configure $(cmake.preset)'
      inputs:
        cmakeArgs: '--preset $(cmake.preset) -DCI_BUILDID=$(GITVERSION_MAJORMINORPATCH)  -DCPM_SOURCE_CACHE=$(Agent.HomeDirectory)/.cpmcache'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
    - task: CmdLine@2
      displayName: 'Start Azure CosmosDB Emulator (Docker)'
      inputs:
        script: |
          echo "Starting Azure Cosmos DB Emulator via Docker..."
          docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20260331
          docker run --publish 8081:8081 --publish 10250-10255:10250-10255 --name linux-emulator --rm --detach mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-EN20260331
          echo "Waiting for emulator to start..."
          timeout /t 60
          echo "Emulator should be running on http://localhost:8081"
      condition: succeeded()
    - task: CMake@1
      displayName: 'CMake Build $(cmake.preset)'
      inputs:
        cmakeArgs: '--build --preset $(cmake.preset) -DCI_BUILDID=$(GITVERSION_MAJORMINORPATCH)  -DCPM_SOURCE_CACHE=$(Agent.HomeDirectory)/.cpmcache'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
      condition: succeeded()
    - task: CMake@1
      displayName: 'CMake Tests $(cmake.preset) - Unified Test Suite'
      env:
        "CTEST_OUTPUT_ON_FAILURE": "TRUE"
      inputs:
        cmakeArgs: '-E chdir $(System.DefaultWorkingDirectory)/build/$(cmake.preset) ctest --output-on-failure --verbose'
      continueOnError: true
      condition: succeeded()
    - task: CmdLine@2
      displayName: 'Stop Azure CosmosDB emulator'
      inputs:
        script: |
          echo "Stopping Azure Cosmos DB Emulator..."
          docker stop linux-emulator
          echo "Emulator stopped"
      condition: always()
    - task: PublishTestResults@2
      displayName: 'Publish $(BuildType) Test Results - Unified Suite'
      inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '$(System.DefaultWorkingDirectory)/tests/results/*_test_detail.xml'
          mergeTestResults: true
          buildConfiguration: '$(BuildType)'
          testRunTitle: 'Unified Integration Tests ($(BuildType))'
      continueOnError: true
      condition: succeeded()
    - task: NuGetToolInstaller@1
      displayName: 'Install Nuget on Windows'
      inputs:
        versionSpec: '>=6.0.0-0'
        checkLatest: true
      condition: and(succeeded(), startsWith(variables['Agent.OS'], 'Windows'))
    - task: NuGetCommand@2
      displayName: 'NuGet pack v$(GITVERSION_MAJORMINORPATCH)'
      inputs:
        command: 'pack'
        packagesToPack: 'pack/*.nuspec'
        versioningScheme: 'off'
        buildProperties: 'VERSION=$(GITVERSION_MAJORMINORPATCH)'
      condition: and(succeeded(), startsWith(variables['Agent.OS'], 'Windows'))
    - task: NuGetCommand@2
      displayName: 'NuGet push (Windows only)'
      inputs:
        command: 'push'
        packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;build/*.nupkg'
        nuGetFeedType: 'external'
        publishFeedCredentials: 'sqs-nuget'
      condition: and(succeeded(), eq(variables['BuildType'], 'Release'), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')), startsWith(variables['Agent.OS'], 'Windows'))
    - task: GitHubRelease@1
      displayName: 'Release to GitHub'
      inputs:
        gitHubConnection: 'github-packages-sqs'
        repositoryName: '$(Build.Repository.Name)'
        action: 'create'
        target: '$(Build.SourceVersion)'
        tagSource: 'userSpecifiedTag'
        tag: '$(GITVERSION_MAJORMINORPATCH)'
        title: 'v$(GITVERSION_MAJORMINORPATCH)'
        releaseNotesSource: 'inline'
        releaseNotesInline: 'Documentation https://github.com/$(Build.Repository.Name)'
        isPreRelease: true
        changeLogCompareToRelease: 'lastFullRelease'
        changeLogType: 'commitBased'
        addChangeLog: false
        assetUploadMode: 'replace'
      condition: and(succeeded(), eq(variables['BuildType'], 'Release'), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')), startsWith(variables['Agent.OS'], 'Windows'))

  ###################################################################################################### #### ## #
  ##### Job buildLinux ################################################################################# #### ## #
  ###################################################################################################### #### ## #
  - job: buildLinux
    displayName: 'Build and Test Linux'
    workspace:
      clean: all
    pool:
      name: Default
      demands:
        - Agent.OS -equals Linux
    strategy:
      matrix:
        #GCC-Debug:
        #  BuildType: Debug
        #  cmake.preset: 'Linux-GCC-$(BuildType)'
        #  MSBuildConfiguration: Debug
        #  cmakeExtraArgs: 
        #GCC-Release:
        #  BuildType: Release
        #  cmake.preset: 'Linux-GCC-$(BuildType)'
        #  cmakeExtraArgs: 
        #  MSBuildConfiguration: Release
        Clang-Debug:
          BuildType: Debug
          cmake.preset: 'Linux-Clang-$(BuildType)'
          MSBuildConfiguration: Debug
          cmakeExtraArgs: 
        Clang-Release:
          BuildType: Release
          cmake.preset: 'Linux-Clang-$(BuildType)'
          cmakeExtraArgs: 
          MSBuildConfiguration: Release
    
    steps:
    - checkout: self
      fetchDepth: 0
      name: step1
    
    - task: gitversion-setup@4
      displayName: 'Install GitVersion..'
      inputs:
        versionSpec: '6.x'
        preferLatestVersion: true
    
    - task: gitversion-execute@4
      displayName: 'Determine Version..'
      name: version_step
      inputs:
        useConfigFile: true
        configFilePath: 'GitVersion.yml'
    
    - task: Bash@3
      displayName: 'Start Azure CosmosDB emulator'
      inputs:
        targetType: 'filePath'
        filePath: '$(System.DefaultWorkingDirectory)/tests/setup-emulator.sh'
      condition: succeeded()
    
    - task: CMake@1
      displayName: 'CMake Configure $(cmake.preset)'
      inputs:
        cmakeArgs: '--preset $(cmake.preset) -DCI_BUILDID=$(GITVERSION_MAJORMINORPATCH)  -DCPM_SOURCE_CACHE=$(Agent.HomeDirectory)/.cpmcache'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
    
    - task: CMake@1
      displayName: 'CMake Build $(cmake.preset)'
      inputs:
        cmakeArgs: '--build --preset $(cmake.preset) -DCI_BUILDID=$(GITVERSION_MAJORMINORPATCH)  -DCPM_SOURCE_CACHE=$(Agent.HomeDirectory)/.cpmcache'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
      condition: succeeded()
    
    - task: CMake@1
      displayName: 'CMake Tests $(cmake.preset) - Release'
      env:
        "CTEST_OUTPUT_ON_FAILURE": "TRUE"
      inputs:
        cmakeArgs: '-E chdir $(System.DefaultWorkingDirectory)/build/$(cmake.preset) ctest --output-on-failure --verbose'
      condition: and(succeeded(), eq(variables['BuildType'], 'Release'), startsWith(variables['Agent.OS'], 'Linux'))
      continueOnError: true
    
    - task: CMake@1
      displayName: 'CMake Tests $(cmake.preset) - Debug with Coverage'
      env:
        "CTEST_OUTPUT_ON_FAILURE": "TRUE"
      inputs:
        cmakeArgs: '-E chdir $(System.DefaultWorkingDirectory)/build/$(cmake.preset) ctest --output-on-failure --verbose -T Test -T Coverage'
      condition: and(succeeded(), eq(variables['BuildType'], 'Debug'), startsWith(variables['Agent.OS'], 'Linux'))
      continueOnError: true
    
    - task: Bash@3
      displayName: 'Stop Azure CosmosDB emulator'
      inputs:
        targetType: 'inline'
        script: |
          docker ps
          echo "Stop the running emulator.."
          docker stop linux-emulator
      condition: succeeded()
    
    - task: CmdLine@2
      displayName: 'Coverage collection (Linux builds Only)'
      inputs:
        script: |
          echo "gcovr --delete --root ../../ --print-summary --xml-pretty --xml coverage.xml .  --filter='$(System.DefaultWorkingDirectory)/include/siddiqsoft/*' --filter='$(System.DefaultWorkingDirectory)/tests/*' --gcov-executable 'llvm-cov gcov'"
          gcovr --delete --root $(System.DefaultWorkingDirectory)/ --print-summary --xml-pretty --xml $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests/results/coverage.xml $(System.DefaultWorkingDirectory)/build/$(cmake.preset)  --filter='$(System.DefaultWorkingDirectory)/include/*' --filter='$(System.DefaultWorkingDirectory)/tests/*' --gcov-executable 'llvm-cov gcov'
        workingDirectory: '$(System.DefaultWorkingDirectory)/build/$(cmake.preset)'
      condition: and(succeeded(), eq(variables['BuildType'], 'Debug'), startsWith(variables['Agent.OS'], 'Linux'), startsWith(variables['Agent.OSArchitecture'], 'X64'))
    
    - task: PublishTestResults@2
      displayName: 'Publish $(BuildType) Test Results - Unified Suite'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(System.DefaultWorkingDirectory)/tests/results/*_test_detail.xml'
        mergeTestResults: true
        buildConfiguration: '$(BuildType)'
        testRunTitle: 'Unified Integration Tests ($(BuildType))'
      continueOnError: false
      condition: succeeded()
    
    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Coverage Results (Linux builds)'
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests/results/coverage.*'
      condition: and(succeeded(), startsWith(variables['Agent.OS'], 'Linux'), startsWith(variables['Agent.OSArchitecture'], 'X64'), eq(variables['BuildType'], 'Debug'))
    
