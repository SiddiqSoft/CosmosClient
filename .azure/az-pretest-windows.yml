# ============================================================================
# Azure Pipelines Linux Build Template
# ============================================================================
# This file should contain project-specific pre-test steps for Linux builds.
# It is included in the main Linux build pipeline before running tests.
# ============================================================================

# ============================================================================
# PARAMETERS
# ============================================================================
parameters:
  - name: architecture
    type: string

  - name: runTests
    type: boolean
    
steps:
  # ====================================================================
  # Emulator Setup (for tests)
  # ====================================================================
  - task: BatchScript@1
    enabled: false
    displayName: Start Azure CosmosDB Emulator
    inputs:
      filename: $(System.DefaultWorkingDirectory)/tests/setup-linux-emulator.bat
    condition: and(succeeded(), eq(${{ parameters.runTests }}, true), ne('${{parameters.architecture}}', 'arm64')) # docker on arm64 not available yet    

  # The Emulator takes too long to startup on Windows to be meaningful to start/stop during testing.
  # The Linux emulator runs perfectly and is fast enough to start/stop during testing, so we will only start it on Linux and not Windows.
  - task: PowerShell@2
    enabled: false
    displayName: Wait for Emulator to be Ready
    inputs:
      targetType: inline
      script: |
        Write-Host "Waiting for Azure CosmosDB Emulator to be ready..."
        $maxRetries = 10
        $retryCount = 0
        $emulatorReady = $false

        while (-not $emulatorReady -and $retryCount -lt $maxRetries) {
          try {
            $response = Invoke-WebRequest -Uri "$(emulatorUrl)/_explorer/emulator.pem" -UseBasicParsing -TimeoutSec 5
            if ($response.StatusCode -eq 200) {
              Write-Host "Emulator is ready!"
              $emulatorReady = $true
            } else {
              throw "Unexpected status code: $($response.StatusCode)"
            }
          } catch {
            Write-Host "Emulator not ready yet. Retrying in 6 seconds..."
            Start-Sleep -Seconds 6
            $retryCount++
          }
        }

        if (-not $emulatorReady) {
          throw "Emulator did not become ready within the expected time."
        }
    condition: and(succeeded(), eq(${{ parameters.runTests }}, true), ne('${{parameters.architecture}}', 'arm64')) # docker on arm64 not available yet
    continueOnError: true
