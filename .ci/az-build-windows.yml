# ============================================================================
# Azure Pipelines Windows Build Template
# ============================================================================
#
# Purpose: Build the project on Windows with MSVC compiler
# Called by: azure-pipelines.yml (StgBldWindows stage)
# Triggers: When RunWindows parameter is true
#
# This template:
# 1. Builds the project on Windows with MSVC compiler
# 2. Supports x64 and arm64 architectures
# 3. Runs tests (optional)
# 4. Creates NuGet packages
# 5. Publishes build artifacts

# ============================================================================
# PARAMETERS
# ============================================================================
parameters:
  - name: displayName
    type: string
  - name: architecture
    type: string
  - name: runTests
    type: boolean
    default: true
  - name: matrixConfigs
    type: object
  - name: publishNuGet
    type: boolean
    default: false
  - name: BuildX64
    type: boolean
    default: false
  - name: BuildDebug
    type: boolean
    default: false
  - name: Cleanup
    type: boolean
    default: false

# ============================================================================
# JOBS
# ============================================================================
jobs:
  - job: JobWindowsBuild_${{ parameters.architecture }}
    displayName: ${{ parameters.displayName }}
    
    condition: or( and(eq(${{parameters.BuildX64}}, true), eq('${{ parameters.architecture}}', 'x64')), eq('${{parameters.architecture}}', 'arm64') )
    
    workspace:
      clean: all
    
    pool:
      name: Default
      demands:
        - Agent.OS -equals Windows_NT
        - Agent.OSArchitecture -equals ${{ parameters.architecture }}

    strategy:
      matrix: ${{ parameters.matrixConfigs }}
    
    steps:
      # ====================================================================
      # Checkout & Cleanup
      # ====================================================================
      - checkout: self
        name: step1

      - task: PowerShell@2
        displayName: Cleanup CPM Cache
        inputs:
          targetType: inline
          script: |
            Write-Host "Cleaning up CPM cache..."
            if (Test-Path -Path $(cpmCachePath)) {
              Remove-Item -Recurse -Force -LiteralPath $(cpmCachePath)
              Write-Host "Cleanup successful"
            } else {
              Write-Host "No cleanup needed: path does not exist"
            }
        condition: eq(${{ parameters.Cleanup }}, true)
      
      # ====================================================================
      # Environment Setup
      # ====================================================================
      - task: BatchScript@1
        displayName: Detect Visual Studio paths
        inputs:
          filename: $(System.DefaultWorkingDirectory)/.ci/pipeline_detect_vs_path.bat
          modifyEnvironment: true
      
      - task: BatchScript@1
        displayName: Setup MSVC environment
        inputs:
          filename: $(VCVARS_PATH)
          arguments: $(AGENT_OSARCHITECTURE)
          modifyEnvironment: true
      
      # ====================================================================
      # Version Detection
      # ====================================================================
      - task: gitversion-setup@4
        displayName: Install GitVersion
        inputs:
          versionSpec: 6.x
          preferLatestVersion: true

      - task: gitversion-execute@4
        displayName: Determine Version
        name: version_step
        inputs:
          useConfigFile: true
          configFilePath: GitVersion.yml
          updateBuildNumber: true
      
      # ====================================================================
      # Emulator Setup (for tests)
      # ====================================================================
      - task: CmdLine@2
        displayName: Start Azure CosmosDB Emulator
        inputs:
          script: |
            echo "$((Get-Date).ToUniversalTime()) - Checking if emulator is already running..."
            docker ps --filter "name=$(dockerContainerName)" --filter "status=running" --quiet | findstr . >nul
            if %errorlevel% equ 0 (
              echo "Emulator already running. Skipping start."
              exit /b 0
            )

            echo "$((Get-Date).ToUniversalTime()) - Pulling emulator image..."
            docker pull $(dockerImageUri)

            echo "$((Get-Date).ToUniversalTime()) - Starting emulator..."
            docker run --publish 8081:8081 --publish 10250-10255:10250-10255 ^
              --name $(dockerContainerName) --detach --rm $(dockerImageUri)

            echo "$((Get-Date).ToUniversalTime()) - Waiting for emulator to initialize..."
            powershell -Command "Start-Sleep -Seconds $(emulatorWaitSeconds)"
            
            echo "$((Get-Date).ToUniversalTime()) - Verifying emulator connectivity..."
            powershell -Command "try { $response = Invoke-WebRequest -Uri $(emulatorUrl) -Method Get -TimeoutSec 10; Write-Host '$((Get-Date).ToUniversalTime()) - Emulator is ready' -ForegroundColor Green; } catch { Write-Host '$((Get-Date).ToUniversalTime()) - Emulator not ready: $($_.Exception.Message)' -ForegroundColor Red; exit 1; }"
            echo "$((Get-Date).ToUniversalTime()) - Finished"
        condition: and(succeeded(), eq(${{ parameters.runTests }}, true))
      
      # ====================================================================
      # Build
      # ====================================================================
      - task: CMake@1
        displayName: CMake Configure
        inputs:
          cmakeArgs: "--preset $(cmake.preset) -DCI_BUILDID=$(GITVERSION_MAJORMINORPATCH) -DCPM_SOURCE_CACHE=$(cpmCachePath)"
          workingDirectory: $(System.DefaultWorkingDirectory)
      
      - task: CMake@1
        displayName: CMake Build
        inputs:
          cmakeArgs: "--build --preset $(cmake.preset) -DCI_BUILDID=$(GITVERSION_MAJORMINORPATCH) -DCPM_SOURCE_CACHE=$(cpmCachePath)"
          workingDirectory: $(System.DefaultWorkingDirectory)
        condition: succeeded()

      - task: PublishBuildArtifacts@1
        displayName: Publish Build Artifacts
        inputs:
          PathtoPublish: $(System.DefaultWorkingDirectory)/build/$(cmake.preset)
          ArtifactName: build-$(cmake.preset)
          publishLocation: Container
        condition: succeeded()
      
      # ====================================================================
      # Testing
      # ====================================================================
      - task: CMake@1
        displayName: CMake Tests
        inputs:
          cmakeArgs: "-E chdir $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests ctest --output-junit $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests/results/$(cmake.preset)_test_detail.xml --output-on-failure"
        continueOnError: true
        condition: and(succeeded(), eq(${{ parameters.runTests }}, true))

      - task: CmdLine@2
        displayName: Stop Azure CosmosDB Emulator
        inputs:
          script: docker stop $(dockerContainerName)
        condition: ne('${{parameters.architecture}}', 'arm64') # docker on arm64 not available yet

      - task: PublishTestResults@2
        displayName: Publish Test Results
        inputs:
          testResultsFormat: JUnit
          testRunTitle: Tests $(cmake.preset)
          testResultsFiles: $(System.DefaultWorkingDirectory)/build/$(cmake.preset)/tests/results/$(cmake.preset)_test_detail.xml
          mergeTestResults: false
          buildConfiguration: $(BuildType)
        continueOnError: true
        condition: and(succeeded(), eq(${{ parameters.runTests }}, true), or(eq(variables['BuildType'], 'Release'), failed()))
      
      # ====================================================================
      # Build Number
      # ====================================================================
      - task: PowerShell@2
        displayName: Set Build Number (Release)
        inputs:
          targetType: inline
          script: Write-Host "##vso[build.updateBuildNumber]$(GITVERSION_MAJORMINORPATCH)"
        condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))

      - task: PowerShell@2
        displayName: Set Build Number (Pre-release)
        inputs:
          targetType: inline
          script: Write-Host "##vso[build.updateBuildNumber]$(GITVERSION_SEMVER)"
        condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
      
      # ====================================================================
      # NuGet Packaging
      # ====================================================================
      - task: NuGetToolInstaller@1
        displayName: Install NuGet
        inputs:
          versionSpec: ">=6.0.0-0"
          checkLatest: true
        condition: succeeded()

      - task: NuGetCommand@2
        displayName: NuGet Pack
        inputs:
          command: pack
          packagesToPack: pack/*.nuspec
          versioningScheme: off
          buildProperties: VERSION=$(GITVERSION_MAJORMINORPATCH)
        condition: succeeded()

      - task: PublishBuildArtifacts@1
        displayName: Publish NuGet Artifacts
        inputs:
          PathtoPublish: $(Build.ArtifactStagingDirectory)
          ArtifactName: nuget-packages
          publishLocation: Container
        condition: succeeded()
